<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>

  <!-- Clients -->
  <rect x="40" y="30" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="140" y="65" text-anchor="middle" font-size="15" fill="#1e3a8a">Клієнти (Web / Mobile)</text>

  <!-- Load Balancer -->
  <rect x="400" y="30" width="200" height="60" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="500" y="65" text-anchor="middle" font-size="15" fill="#78350f">Балансувальник навантаження</text>

  <!-- CDN/Static (optional) -->
  <rect x="760" y="30" width="200" height="60" rx="8" fill="#e5e7eb" stroke="#6b7280"/>
  <text x="860" y="55" text-anchor="middle" font-size="14" fill="#374151">CDN / Static</text>
  <text x="860" y="72" text-anchor="middle" font-size="12" fill="#6b7280">(майбутнє)</text>

  <!-- API instances -->
  <rect x="300" y="160" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="375" y="185" text-anchor="middle" font-size="14" fill="#14532d">API instance #1</text>
  <text x="375" y="203" text-anchor="middle" font-size="11" fill="#15803d">FastAPI (uvicorn)</text>

  <rect x="500" y="160" width="150" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="575" y="185" text-anchor="middle" font-size="14" fill="#14532d">API instance #2</text>
  <text x="575" y="203" text-anchor="middle" font-size="11" fill="#15803d">FastAPI (uvicorn)</text>

  <text x="500" y="255" text-anchor="middle" font-size="12" fill="#6b7280">... горизонтальне масштабування під пікові навантаження ...</text>

  <!-- Cache / Locks -->
  <rect x="120" y="300" width="220" height="70" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="230" y="328" text-anchor="middle" font-size="14" fill="#7f1d1d">Redis</text>
  <text x="230" y="346" text-anchor="middle" font-size="11" fill="#991b1b">кеш даних + розподілені</text>
  <text x="230" y="360" text-anchor="middle" font-size="11" fill="#991b1b">блокування слотів бронювання</text>

  <!-- Message queue (future) -->
  <rect x="660" y="300" width="220" height="70" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="770" y="328" text-anchor="middle" font-size="14" fill="#4c1d95">Черга повідомлень</text>
  <text x="770" y="346" text-anchor="middle" font-size="11" fill="#5b21b6">(RabbitMQ / Kafka —</text>
  <text x="770" y="360" text-anchor="middle" font-size="11" fill="#5b21b6">сповіщення, майбутнє)</text>

  <!-- Database primary -->
  <rect x="330" y="440" width="170" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="415" y="468" text-anchor="middle" font-size="14" fill="#0c4a6e">PostgreSQL</text>
  <text x="415" y="486" text-anchor="middle" font-size="11" fill="#075985">Primary (write)</text>

  <!-- Database replica -->
  <rect x="530" y="440" width="170" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-dasharray="4"/>
  <text x="615" y="468" text-anchor="middle" font-size="14" fill="#0c4a6e">PostgreSQL</text>
  <text x="615" y="486" text-anchor="middle" font-size="11" fill="#075985">Read replica (майбутнє)</text>

  <!-- Legend -->
  <rect x="40" y="560" width="14" height="14" fill="#dcfce7" stroke="#16a34a"/>
  <text x="60" y="571" font-size="12" fill="#374151">Реалізовано в цій лабораторній</text>
  <rect x="320" y="560" width="14" height="14" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="340" y="571" font-size="12" fill="#374151">Заплановано на наступні лабораторні</text>

  <!-- Arrows -->
  <line x1="240" y1="60" x2="398" y2="60" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="90" x2="380" y2="158" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="90" x2="570" y2="158" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="60" x2="602" y2="60" stroke="#333" stroke-width="1" marker-end="url(#arrow)" stroke-dasharray="4"/>

  <line x1="375" y1="220" x2="260" y2="298" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="220" x2="720" y2="298" stroke="#333" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <line x1="375" y1="220" x2="410" y2="438" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="575" y1="220" x2="500" y2="438" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="510" x2="600" y2="510" stroke="#333" stroke-width="1" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <text x="500" y="605" text-anchor="middle" font-size="13" fill="#111827" font-weight="bold">
    Архітектура: Coworking &amp; Conference Room Booking Platform
  </text>
</svg>
