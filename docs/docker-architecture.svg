<svg viewBox="0 0 1000 575" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker>
  </defs>
  <rect width="1000" height="575" fill="#fff"/>

  <rect x="30" y="200" width="150" height="80" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="105" y="235" text-anchor="middle" font-size="15" fill="#1e3a8a">Браузер / клієнт</text>
  <text x="105" y="256" text-anchor="middle" font-size="12" fill="#1e3a8a">localhost:8000</text>

  <!-- docker host -->
  <rect x="230" y="30" width="740" height="490" rx="12" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6"/>
  <text x="250" y="55" font-size="13" fill="#475569">Docker (docker compose up --build)</text>

  <!-- frontend network -->
  <rect x="260" y="80" width="300" height="400" rx="10" fill="#ecfdf5" stroke="#16a34a"/>
  <text x="275" y="102" font-size="13" fill="#166534">мережа frontend</text>

  <!-- backend network -->
  <rect x="400" y="120" width="545" height="380" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4"/>
  <text x="415" y="142" font-size="13" fill="#991b1b">мережа backend (internal: true — без доступу ззовні)</text>

  <!-- app -->
  <rect x="420" y="190" width="200" height="150" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="215" text-anchor="middle" font-size="15" fill="#14532d" font-weight="bold">app</text>
  <text x="520" y="237" text-anchor="middle" font-size="12" fill="#166534">FastAPI + uvicorn</text>
  <text x="520" y="256" text-anchor="middle" font-size="11" fill="#166534">multi-stage образ</text>
  <text x="520" y="275" text-anchor="middle" font-size="11" fill="#166534">entrypoint: таблиці + адмін</text>
  <text x="520" y="294" text-anchor="middle" font-size="11" fill="#166534">HEALTHCHECK /health</text>
  <text x="520" y="326" text-anchor="middle" font-size="11" fill="#7c2d12">dev: bind mount ./app + --reload</text>

  <!-- db -->
  <rect x="720" y="170" width="200" height="100" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="820" y="198" text-anchor="middle" font-size="15" fill="#0c4a6e" font-weight="bold">db</text>
  <text x="820" y="220" text-anchor="middle" font-size="12" fill="#075985">postgres:16-alpine</text>
  <text x="820" y="240" text-anchor="middle" font-size="11" fill="#075985">healthcheck: pg_isready</text>

  <rect x="740" y="330" width="160" height="60" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="820" y="357" text-anchor="middle" font-size="13" fill="#713f12" font-weight="bold">том db_data</text>
  <text x="820" y="375" text-anchor="middle" font-size="11" fill="#713f12">дані переживають контейнер</text>

  <!-- redis -->
  <rect x="720" y="420" width="200" height="60" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="820" y="446" text-anchor="middle" font-size="15" fill="#7f1d1d" font-weight="bold">redis</text>
  <text x="820" y="465" text-anchor="middle" font-size="11" fill="#991b1b">healthcheck: redis-cli ping</text>

  <line x1="180" y1="240" x2="418" y2="240" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="300" y="224" text-anchor="middle" font-size="11" fill="#333">HTTP (єдиний відкритий порт)</text>
  <line x1="620" y1="225" x2="718" y2="225" stroke="#333" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="670" y="217" text-anchor="middle" font-size="11" fill="#333">SQL</text>
  <line x1="570" y1="342" x2="740" y2="440" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="820" y1="272" x2="820" y2="328" stroke="#ca8a04" stroke-width="2" marker-end="url(#a)"/>

  <text x="600" y="552" text-anchor="middle" font-size="13" fill="#334155">depends_on: app чекає, поки db і redis стануть healthy</text>
</svg>
