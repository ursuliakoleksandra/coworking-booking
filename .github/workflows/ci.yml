name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Лінтери і тести
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Встановлення залежностей
        run: pip install -r requirements-dev.txt

      - name: black
        run: black --check .

      - name: ruff
        run: ruff check .

      - name: flake8
        run: flake8 .

      - name: pytest
        run: pytest -v

  docker-build:
    name: Збірка production-образу
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Перевірка docker-compose (sandbox, production, dev-режим)
        run: |
          docker compose --env-file .env.sandbox.example config --quiet
          docker compose --env-file .env.production.example config --quiet
          docker compose --env-file .env.sandbox.example -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - name: Збірка образу (лише робочі залежності)
        run: docker build --build-arg REQUIREMENTS=requirements.txt -t coworking-booking:ci .
